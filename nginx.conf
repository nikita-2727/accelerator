# проксирует запросы к приложению отджельно на бек, отдельно на фронт, также проксирует minio и перенапрвляет на https

# Редирект с HTTP на HTTPS
server {
    listen 80;
    server_name букволов-ии.рф www.букволов-ии.рф s3.букволов-ии.рф;

    # Папка для проверки сертификатов
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Основной домен – фронтенд + API
server {
    listen 443 ssl http2;
    server_name букволов-ии.рф www.букволов-ии.рф;

    # SSL-сертификаты (укажи реальные пути после получения от Certbot)
    ssl_certificate     /etc/letsencrypt/live/букволов-ии.рф/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/букволов-ии.рф/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 1000M;

    # Статика фронтенда
    location / {
        root /usr/share/nginx/html;
        index index.html;
        # Важно для SPA-роутера (React Router, Vue Router), чтобы не было 404 при обновлении страницы
        try_files $uri $uri/ /index.html;
    }

    # Проксирование API на Go-бэкенд
    location /api/ {
        # Если Nginx в Docker-сети, используй http://app:8000;
        # Если Nginx на хосте, используй http://127.0.0.1:8000;
        proxy_pass http://app:8000/;
        proxy_request_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Поддомен для MinIO
server {
    listen 443 ssl http2;
    server_name s3.букволов-ии.рф;

    ssl_certificate     /etc/letsencrypt/live/букволов-ии.рф/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/букволов-ии.рф/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 0;

    location / {
        proxy_pass http://minio:9000;   # внутри Docker-сети; иначе http://127.0.0.1:9000

        # ★ Критически важно: прокидываем оригинальный Host, под который подписан Presigned URL
        proxy_set_header Host $host;

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_pass_request_headers on;
        # При необходимости добавьте CORS-заголовки
    }
}